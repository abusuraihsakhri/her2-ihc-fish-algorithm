version: '3.8'

services:
  her2-ihc-fish-algorithm:
    build: .
    container_name: her2-ihc-fish-algorithm
    ports:
      - "8000:8000"
    environment:
      # SECURITY: Set a secure random key in your .env file or deployment environment
      # Generate: python -c "import secrets; print(secrets.token_hex(32))"
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:-please-change-this-to-a-secure-random-key}
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
