version: '3.8'

services:
  her2-ihc-fish-algorithm:
    build: .
    container_name: her2-ihc-fish-algorithm
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=her2-ihc-fish-algorithm-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
