name: Her2 Ihc Fish Algorithm CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: her2-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Generate ephemeral audit secret for CI
      run: echo "AUDIT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"

    - name: Check Python syntax and browser JavaScript
      run: |
        python -m compileall -q her2_algorithm.py agents tests
        node --check app.js

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Verify HMAC tamper detection and PHI guard
      run: |
        python - <<'PY'
        from agents.base import AuditTrail, PHIGuard, SecurityException
        trail = AuditTrail()
        trail.log("ci", "testing", "verification", {"status": "PASS"})
        assert trail.verify_integrity()
        trail.logs[0]["payload_hash"] = "tampered"
        assert not trail.verify_integrity()
        try:
            PHIGuard.assert_no_phi("Patient MRN-123456")
        except SecurityException:
            pass
        else:
            raise AssertionError("PHI guard check failed")
        PY
